name: build

# Derived from upstream rustdesk/rustdesk-server's build.yaml, cut down to what
# this fork needs:
#
#   - GHCR only. It authenticates with the built-in GITHUB_TOKEN, so there is no
#     registry credential to store. Docker Hub push is left out deliberately.
#   - linux/amd64 and linux/arm64 only. The fork dropped i386 because the API
#     server has no i386 build, and armv7 is not used here.
#   - One buildx invocation per image produces a real multi-arch manifest, so
#     there is no per-arch tag and no separate manifest job.
#   - `latest` never moves on its own. Only a manual run with move_latest=true
#     touches it.
#
# Images (under ghcr.io/<owner>/):
#   rustdesk-server          classic, one binary per container
#   rustdesk-server-s6       hbbs + hbbr under s6
#   rustdesk-server-s6-api   the above plus lejianwen/rustdesk-api

on:
  workflow_dispatch:
    inputs:
      move_latest:
        description: "Also move the :latest tag"
        type: boolean
        default: false
      build_api_image:
        description: "Also build the s6-api image (pulls a third-party base)"
        type: boolean
        default: true
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Nothing is published from a tree that does not pass its own tests, the leak
  # regression included.
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked -- --nocapture

  build:
    name: Build ${{ matrix.job.arch }}
    needs: test
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { arch: "amd64", target: "x86_64-unknown-linux-musl" }
          - { arch: "arm64", target: "aarch64-unknown-linux-musl" }
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Install cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build
        run: cross build --release --locked --target ${{ matrix.job.target }}

      - name: Collect binaries
        run: |
          mkdir -p out
          cp target/${{ matrix.job.target }}/release/hbbs \
             target/${{ matrix.job.target }}/release/hbbr \
             target/${{ matrix.job.target }}/release/rustdesk-utils out/
          chmod -v a+x out/*

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-${{ matrix.job.arch }}
          path: out/*
          if-no-files-found: error

  docker:
    name: Images
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download amd64 binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-linux-amd64
          path: bin/amd64

      - name: Download arm64 binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-linux-arm64
          path: bin/arm64

      - name: Stage binaries into both build contexts
        run: |
          chmod -v a+x bin/amd64/* bin/arm64/*
          for ctx in docker docker-classic; do
            mkdir -p "$ctx/bin"
            cp -r bin/amd64 bin/arm64 "$ctx/bin/"
          done

      # Tags are <upstream release>-<short fork rev>, e.g. 1.1.16-a1b2c3d, plus
      # the git tag when this run was triggered by one. Both are immutable.
      - name: Compute tags
        id: tags
        run: |
          set -eu
          . ./UPSTREAM_VERSION
          REV=$(git rev-parse --short HEAD)
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          VERSION_TAG="${UPSTREAM_RELEASE}-${REV}"
          echo "version=$VERSION_TAG" >> "$GITHUB_OUTPUT"
          SUFFIXES="$VERSION_TAG"
          case "${{ github.ref }}" in
            refs/tags/*) SUFFIXES="$SUFFIXES ${GITHUB_REF#refs/tags/}" ;;
          esac
          if [ "${{ inputs.move_latest }}" = "true" ]; then
            SUFFIXES="$SUFFIXES latest"
          fi
          echo "suffixes=$SUFFIXES" >> "$GITHUB_OUTPUT"
          echo "Tagging with: $SUFFIXES"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tag lists
        id: taglists
        run: |
          set -eu
          OWNER='${{ steps.tags.outputs.owner }}'
          classic=""; s6=""; api=""
          for s in ${{ steps.tags.outputs.suffixes }}; do
            classic="$classic""ghcr.io/$OWNER/rustdesk-server:$s"$'\n'
            s6="$s6""ghcr.io/$OWNER/rustdesk-server-s6:$s"$'\n'
            api="$api""ghcr.io/$OWNER/rustdesk-server-s6-api:$s"$'\n'
          done
          { echo "classic<<EOT"; echo "$classic"; echo "EOT"; } >> "$GITHUB_OUTPUT"
          { echo "s6<<EOT";      echo "$s6";      echo "EOT"; } >> "$GITHUB_OUTPUT"
          { echo "api<<EOT";     echo "$api";     echo "EOT"; } >> "$GITHUB_OUTPUT"

      - name: Build and push classic image
        uses: docker/build-push-action@v6
        with:
          context: ./docker-classic
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.taglists.outputs.classic }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}

      - name: Build and push s6 image
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.taglists.outputs.s6 }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}

      # Pulls lejianwen/rustdesk-api as its base, so it can break for reasons
      # outside this repository. It does not gate the other two images.
      - name: Build and push s6-api image
        if: github.event_name != 'workflow_dispatch' || inputs.build_api_image
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.taglists.outputs.api }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-linux-${{ matrix.arch }}
          path: ${{ matrix.arch }}

      - name: Pack
        run: |
          chmod -v a+x ${{ matrix.arch }}/*
          zip -j rustdesk-server-linux-${{ matrix.arch }}.zip ${{ matrix.arch }}/*

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: rustdesk-server-linux-${{ matrix.arch }}.zip
