name: ci

# Every push and PR. The websocket leak regression test lives here: it is the
# thing that stops the CLOSE_WAIT leak coming back.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --all-targets

      # Includes tests/ws_leak.rs, which fails if a websocket connection is
      # ever again left open after the client goes away.
      - name: Test
        run: cargo test --locked -- --nocapture

      - name: Relay-RTT tool tests
        run: python3 -m unittest discover -s tools/relay-rtt -v

      - name: Backup script tests
        run: python3 -m unittest discover -s tools/backup -v

      # Formatting is checked, and enforced, on the files this fork owns only.
      # Upstream's own files are not rustfmt-clean, and reformatting them is what
      # turns an upstream change into a merge conflict, so they are left alone.
      # The footprint (how many lines of each upstream file the fork changes) goes
      # to the job summary, so drift is visible. See NOTES.md, "Fork hygiene".
      - name: Fork footprint, and format of fork-owned files
        run: |
          set -o pipefail
          tools/fork-footprint.sh --fmt-check | tee /tmp/footprint.txt
          { echo '### Fork footprint'; echo '```'; cat /tmp/footprint.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Advisory: upstream's own code does not pass this cleanly, so it reports
      # rather than gates.
      - name: Clippy (advisory)
        continue-on-error: true
        run: cargo clippy --all-targets

  soak:
    # A static name: a name built from an expression is shown unevaluated when the
    # job is skipped, as it is on pull requests.
    name: Soak
    # Only where it will not hold up a PR: manual runs and pushes to main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Soak
        env:
          SOAK_MINUTES: ${{ github.event_name == 'workflow_dispatch' && '60' || '10' }}
        run: cargo test --release --locked --test ws_soak -- --ignored --nocapture
