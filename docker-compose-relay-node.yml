# One relay server (hbbr only), for the machines in a multi-relay setup.
#
# Run this on every relay machine. The ID server (hbbs) runs elsewhere, once, and
# lists all the relays:
#
#     hbbs -r hk.example.com:21117,sh.example.com:21117
#
# and is given a routing table (see docs/relay-routing.md) saying which relay is
# nearest which clients. hbbr itself needs to know nothing about the others, or about
# hbbs: it pairs two connections that present the same one-time ID and passes bytes
# between them.
#
# Not exercised on a real multi-machine deployment; the routing logic is tested
# with stand-in relays on one machine.

services:
  hbbr:
    container_name: rustdesk_hbbr
    image: ghcr.io/yuanshi76/rustdesk-server:v0.4.0
    # By default hbbr accepts any client, so anyone who learns this address can use this
    # machine's bandwidth. To accept only your clients, give it the same text they have
    # in their Key field: the FULL contents of hbbs's id_ed25519.pub, one line ending in =.
    #
    #     command: hbbr -k <contents of id_ed25519.pub>
    #
    # Do NOT write `-k _` here. That makes hbbr create its own key pair in this machine's
    # folder, which differs from hbbs's, and every client is then refused with
    # "Relay authentication failed ... invalid key" in this relay's log. See
    # docs/multi-relay-architecture.md.
    command: hbbr
    ports:
      - "21117:21117"       # relay
      - "21119:21119"       # relay websocket
    volumes:
      - ./data:/root
    mem_limit: 128m
    restart: unless-stopped

# The address clients reach this relay on must be what you write in hbbs's -r list
# and in the routing table, exactly. If you publish 21117 as some other host port,
# that host port is the one to write there.
#
# Open 21117/tcp (and 21119/tcp for websocket clients) in the machine's firewall.
